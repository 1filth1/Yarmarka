<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCrDBQkvL_ngTCaPxx_Gf3pdjpqkMwa4Fo",
    authDomain: "yarmarka-4fd0f.firebaseapp.com",
    projectId: "yarmarka-4fd0f",
    storageBucket: "yarmarka-4fd0f.firebasestorage.app",
    messagingSenderId: "182060849552",
    appId: "1:182060849552:web:3eb7a8a6fb4d700bb6fb15"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Глобальная функция сохранения всего состояния в Firebase
  window.saveToFirebase = async function() {
      try {
          await setDoc(doc(db, 'crm_data', 'main'), {
              users: state.users,
              departments: state.departments,
              clients: state.clients,
              companies: state.companies,
              tickets: state.tickets,
              categories: state.categories,
              settings: state.settings,
              updatedAt: new Date().toISOString()
          }, { merge: true });
      } catch (e) {
          console.error("Ошибка сохранения в Firebase: ", e);
      }
  };

  // Глобальная функция инициализации и подписки на изменения
  window.initFirebase = async function() {
      const docRef = doc(db, 'crm_data', 'main');
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
          const data = docSnap.data();
          state.users = data.users || [];
          state.departments = data.departments || [];
          state.clients = data.clients || [];
          state.companies = data.companies || [];
          state.tickets = data.tickets || [];
          state.categories = data.categories || [];
          state.settings = data.settings || { theme: 'light', companyName: 'Ярмарка CRM' };
      } else {
          console.log("База пуста, инициализация демо-данных...");
          seedData();
          await window.saveToFirebase();
      }

      // Подписка на изменения в реальном времени (Real-time)
      onSnapshot(docRef, (doc) => {
          if (doc.exists()) {
              const newData = doc.data();
              // Обновляем локальное состояние
              state.users = newData.users;
              state.departments = newData.departments;
              state.clients = newData.clients;
              state.companies = newData.companies;
              state.tickets = newData.tickets;
              state.categories = newData.categories;
              state.settings = newData.settings;

              // Перерисовка активных экранов
              if (document.getElementById('page-tickets')?.classList.contains('active')) renderTickets();
              if (document.getElementById('page-recurring')?.classList.contains('active')) renderRecurring();
              if (document.getElementById('page-dashboard')?.classList.contains('active')) renderDashboard();
              if (document.getElementById('page-staff')?.classList.contains('active')) renderStaff();
              if (document.getElementById('page-users')?.classList.contains('active')) renderUsers();
              if (document.getElementById('page-departments')?.classList.contains('active')) renderDepartments();
          }
      });

      // Запуск приложения после загрузки данных
      if (state.settings.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      checkAuth();
  };
</script>
